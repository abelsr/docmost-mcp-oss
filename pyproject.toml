[project]
name = "docmost-mcp-oss"
version = "0.3.0"
description = "MCP server (FastMCP) for Docmost: read and edit pages, spaces and comments over the REST API and the Yjs collaboration WebSocket"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Abel Santillan Rodriguez" }]
keywords = ["mcp", "model-context-protocol", "docmost", "fastmcp", "yjs", "wiki"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=4.0,<5",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/abelsr/docmost-mcp-oss"
Repository = "https://github.com/abelsr/docmost-mcp-oss"
Issues = "https://github.com/abelsr/docmost-mcp-oss/issues"
Changelog = "https://github.com/abelsr/docmost-mcp-oss/blob/main/CHANGELOG.md"

[project.scripts]
docmost-mcp-oss = "docmost_mcp_oss.server:main"

[project.optional-dependencies]
# Writing page bodies via Docmost's Yjs WebSocket.
yjs = ["pycrdt>=0.14", "websockets>=13"]

[dependency-groups]
dev = ["ruff>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docmost_mcp_oss"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
