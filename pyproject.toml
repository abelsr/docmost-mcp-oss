[project]
name = "docmost-mcp"
version = "0.1.0"
description = "MCP server (FastMCP) for Docmost, on top of its internal REST API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.0,<5",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
docmost-mcp = "docmost_mcp.server:main"

[project.optional-dependencies]
# Writing page bodies via Docmost's Yjs WebSocket.
yjs = ["pycrdt>=0.14", "websockets>=13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docmost_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
